name: API-MOTOR Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Start API-MOTOR
        run: |
          java -jar api-motor.jar &
          echo "Waiting for API to start..."
          for i in {1..15}; do
            if curl -s http://localhost:18080/api/health | grep -q "UP"; then
              echo "API is up."
              break
            fi
            sleep 2
          done

      - name: Run tests
        run: mvn clean test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
